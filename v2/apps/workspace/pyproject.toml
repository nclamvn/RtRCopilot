[project]
name = "agent-workspace"
version = "0.1.0"
description = "Independent local-first agent workspace, AW-01 proof"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic-ai-slim[dbos]==2.62.0",
  "dbos==3.2.0",
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_workspace"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
