[project]
name = "rtr-copilot-backend"
version = "0.1.0"
description = "RtR Copilot V2 platform foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.16.4",
  "asyncpg==0.30.0",
  "boto3==1.40.13",
  "cryptography==50.0.0",
  "defusedxml==0.7.1",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "openpyxl==3.1.5",
  "pillow==12.3.0",
  "prometheus-client==0.22.1",
  "pymupdf==1.26.3",
  "pyjwt[crypto]==2.13.0",
  "pypdf==6.14.2",
  "python-docx==1.2.0",
  "python-pptx==1.0.2",
  "pydantic-settings==2.10.1",
  "psycopg[binary]==3.2.9",
  "redis==6.4.0",
  "reportlab==4.4.3",
  "sqlalchemy[asyncio]==2.0.43",
  "uvicorn[standard]==0.35.0",
  "vosk==0.3.45",
]

[dependency-groups]
dev = [
  "mypy==1.17.1",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "ruff==0.12.9",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rtr_copilot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["rtr_copilot"]
