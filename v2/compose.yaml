name: rtr-copilot-v2

services:
  postgres:
    # TIP-012 Task 4 — digest-pinned (image policy). Tag kept for readability.
    image: pgvector/pgvector:pg16@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_RUNTIME_USER: ${POSTGRES_RUNTIME_USER}
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-runtime.sh:/docker-entrypoint-initdb.d/20-runtime.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      POSTGRES_DSN: ${POSTGRES_DSN}
      MIGRATION_DSN: ${MIGRATION_DSN}
      REDIS_URL: ${REDIS_URL}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  redis:
    # TIP-012 Task 4 — digest-pinned (image policy). Tag kept for readability.
    image: redis:7.2.5-alpine@sha256:6aaf3f5e6bc8a592fbfe2cccf19eb36d27c39d12dab4f4b01556b7449e7b1f44
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    # TIP-012 Task 4 — digest-pinned (image policy). Tag kept for readability.
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  minio-init:
    # TIP-012 Task 4 — digest-pinned (image policy). Tag kept for readability.
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z@sha256:aead63c77f9db9107f1696fb08ecb0faeda23729cde94b0f663edf4fe09728e3
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"
        mc mb --ignore-existing "local/$$S3_BUCKET"
        mc anonymous set none "local/$$S3_BUCKET"
    restart: "no"

  api:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    command: ["uvicorn", "rtr_copilot.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    read_only: true
    tmpfs:
      - /tmp:size=536870912,mode=1770,uid=10001,gid=10001
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_DSN: ${POSTGRES_DSN}
      REDIS_URL: ${REDIS_URL}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      APP_ENV: ${APP_ENV}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_ALLOWED_DOMAINS: ${OIDC_ALLOWED_DOMAINS}
      OIDC_GROUP_MAPPING: ${OIDC_GROUP_MAPPING:-{}}
      DEV_OIDC_ENABLED: ${DEV_OIDC_ENABLED:-false}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-3600}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-rtr_session}
      EXPECTED_SCHEMA_REVISION: ${EXPECTED_SCHEMA_REVISION:-0008_document_operating_system}
      SOT_STAGING_ROOT: ${SOT_STAGING_ROOT:-/tmp/rtr-sot-staging}
      SOT_SIGNING_SECRET: ${SOT_SIGNING_SECRET:-development-only-sot-signing-secret-32bytes}
      SOT_ALLOW_CLAIM_AS_APPROVED: ${SOT_ALLOW_CLAIM_AS_APPROVED:-false}
      RAG_EMBEDDING_DIMENSION: ${RAG_EMBEDDING_DIMENSION:-64}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-rtr-offline-hash-embedding}
      RAG_EMBEDDING_VERSION: ${RAG_EMBEDDING_VERSION:-1}
      RAG_CHUNK_MAX_CHARS: ${RAG_CHUNK_MAX_CHARS:-1200}
      RAG_CHUNK_OVERLAP_CHARS: ${RAG_CHUNK_OVERLAP_CHARS:-120}
      RAG_QUERY_MAX_BYTES: ${RAG_QUERY_MAX_BYTES:-4096}
      RAG_CANDIDATE_LIMIT: ${RAG_CANDIDATE_LIMIT:-200}
      RAG_METADATA_SCAN_LIMIT: ${RAG_METADATA_SCAN_LIMIT:-5000}
      RAG_RETRIEVAL_TIMEOUT_MS: ${RAG_RETRIEVAL_TIMEOUT_MS:-2000}
      RAG_TOP_K: ${RAG_TOP_K:-5}
      RAG_MIN_VECTOR_SCORE: ${RAG_MIN_VECTOR_SCORE:-0.15}
      RAG_EVIDENCE_MAX_BYTES: ${RAG_EVIDENCE_MAX_BYTES:-16000}
      RAG_ANSWER_MAX_CHARS: ${RAG_ANSWER_MAX_CHARS:-12000}
      RAG_PROVIDER_TIMEOUT_SECONDS: ${RAG_PROVIDER_TIMEOUT_SECONDS:-5}
      RAG_PROVIDER_MODE: ${RAG_PROVIDER_MODE:-local}
      RAG_EXTERNAL_CLASSIFICATION_ALLOWLIST: ${RAG_EXTERNAL_CLASSIFICATION_ALLOWLIST:-}
      RAG_EXTERNAL_ENDPOINT_POLICY: ${RAG_EXTERNAL_ENDPOINT_POLICY:-}
      RAG_EXTERNAL_CREDENTIAL_SOURCE: ${RAG_EXTERNAL_CREDENTIAL_SOURCE:-}
      RAG_GAP_ROUTING_KEY: ${RAG_GAP_ROUTING_KEY:-curator:sot}
      MAINTENANCE_MODE: ${MAINTENANCE_MODE:-false}
      RETENTION_POLICY_JSON: ${RETENTION_POLICY_JSON:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 3s
      timeout: 4s
      retries: 20
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    command: ["python", "-m", "rtr_copilot.worker.main"]
    read_only: true
    tmpfs:
      - /tmp:size=536870912,mode=1770,uid=10001,gid=10001
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_DSN: ${POSTGRES_DSN}
      REDIS_URL: ${REDIS_URL}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      APP_ENV: ${APP_ENV}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_ALLOWED_DOMAINS: ${OIDC_ALLOWED_DOMAINS}
      OIDC_GROUP_MAPPING: ${OIDC_GROUP_MAPPING:-{}}
      DEV_OIDC_ENABLED: ${DEV_OIDC_ENABLED:-false}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-3600}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-rtr_session}
      EXPECTED_SCHEMA_REVISION: ${EXPECTED_SCHEMA_REVISION:-0008_document_operating_system}
      SOT_STAGING_ROOT: ${SOT_STAGING_ROOT:-/tmp/rtr-sot-staging}
      SOT_SIGNING_SECRET: ${SOT_SIGNING_SECRET:-development-only-sot-signing-secret-32bytes}
      SOT_ALLOW_CLAIM_AS_APPROVED: ${SOT_ALLOW_CLAIM_AS_APPROVED:-false}
      RAG_EMBEDDING_DIMENSION: ${RAG_EMBEDDING_DIMENSION:-64}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-rtr-offline-hash-embedding}
      RAG_EMBEDDING_VERSION: ${RAG_EMBEDDING_VERSION:-1}
      RAG_CHUNK_MAX_CHARS: ${RAG_CHUNK_MAX_CHARS:-1200}
      RAG_CHUNK_OVERLAP_CHARS: ${RAG_CHUNK_OVERLAP_CHARS:-120}
      RAG_QUERY_MAX_BYTES: ${RAG_QUERY_MAX_BYTES:-4096}
      RAG_CANDIDATE_LIMIT: ${RAG_CANDIDATE_LIMIT:-200}
      RAG_METADATA_SCAN_LIMIT: ${RAG_METADATA_SCAN_LIMIT:-5000}
      RAG_RETRIEVAL_TIMEOUT_MS: ${RAG_RETRIEVAL_TIMEOUT_MS:-2000}
      RAG_TOP_K: ${RAG_TOP_K:-5}
      RAG_MIN_VECTOR_SCORE: ${RAG_MIN_VECTOR_SCORE:-0.15}
      RAG_EVIDENCE_MAX_BYTES: ${RAG_EVIDENCE_MAX_BYTES:-16000}
      RAG_ANSWER_MAX_CHARS: ${RAG_ANSWER_MAX_CHARS:-12000}
      RAG_PROVIDER_TIMEOUT_SECONDS: ${RAG_PROVIDER_TIMEOUT_SECONDS:-5}
      RAG_PROVIDER_MODE: ${RAG_PROVIDER_MODE:-local}
      RAG_EXTERNAL_CLASSIFICATION_ALLOWLIST: ${RAG_EXTERNAL_CLASSIFICATION_ALLOWLIST:-}
      RAG_EXTERNAL_ENDPOINT_POLICY: ${RAG_EXTERNAL_ENDPOINT_POLICY:-}
      RAG_EXTERNAL_CREDENTIAL_SOURCE: ${RAG_EXTERNAL_CREDENTIAL_SOURCE:-}
      RAG_GAP_ROUTING_KEY: ${RAG_GAP_ROUTING_KEY:-curator:sot}
      MAINTENANCE_MODE: ${MAINTENANCE_MODE:-false}
      RETENTION_POLICY_JSON: ${RETENTION_POLICY_JSON:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-}
      # TIP-012 Task 3 — worker Prometheus endpoint (internal, compose-network
      # only; never published in the hardened profile). Prometheus scrapes
      # worker:9100 per infra/observability/prometheus.yml.
      WORKER_METRICS_PORT: ${WORKER_METRICS_PORT:-9100}
    # Documentation only: the metrics port is reachable by other services on the
    # compose network without being published to the host.
    expose:
      - "9100"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,redis; r=redis.Redis.from_url(os.environ['REDIS_URL']); assert r.exists('rtr:worker:heartbeat')"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  clamav:
    # TIP-012 Task 4 — digest-pinned (image policy). Tag kept for readability.
    image: clamav/clamav-debian:1.4.5@sha256:50296b62b23764b474be18310521f64a720524d69334ea5236aab5fac44ff993
    environment:
      CLAMAV_NO_FRESHCLAMD: "false"
      CLAMD_CONF_SelfCheck: "30"
      # Default unchanged (2 days). Overridable because sandboxed environments
      # cannot reach database.clamav.net (TIP-012 environment note).
      MALWARE_SIGNATURE_MAX_AGE_SECONDS: ${MALWARE_SIGNATURE_MAX_AGE_SECONDS:-172800}
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          clamdcheck.sh &&
          signature_date=$$(clamdscan --version | awk -F/ '{print $$3}') &&
          signature_age=$$(($$(date +%s) - $$(date -d "$$signature_date" +%s))) &&
          test "$$signature_age" -le "$$MALWARE_SIGNATURE_MAX_AGE_SECONDS"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/status').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 3s
      timeout: 4s
      retries: 20
    restart: unless-stopped

  # TIP-012 Task 1 (D-012-01): TLS ingress. Inert in the default/dev profile;
  # activated by the `hardened` profile together with compose.hardened.yaml,
  # which unpublishes every other service port (AC-01). Digest pinned —
  # caddy:2 (v2.11.4) as tested for this TIP.
  ingress:
    profiles: ["hardened"]
    image: caddy:2.11.4@sha256:844f60b64e4724a5aa8245e019dace0d3f199f7433ce6c57676cb30a920dbad9
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=16777216
    environment:
      INGRESS_HOST: ${INGRESS_HOST:-rtr.local}
      INGRESS_HSTS_MAX_AGE: ${INGRESS_HSTS_MAX_AGE:-604800}
      INGRESS_TLS_MODE: ${INGRESS_TLS_MODE:-internal}
    volumes:
      - ./infra/ingress/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${INGRESS_CERTS_DIR:-./infra/ingress/certs}:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "127.0.0.1:${INGRESS_HTTP_PORT:-80}:80"
      - "127.0.0.1:${INGRESS_HTTPS_PORT:-443}:443"
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  clamav-data:
  postgres-data:
  redis-data:
  minio-data:
  caddy-data:
  caddy-config:
