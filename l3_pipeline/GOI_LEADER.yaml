- record: VOICE.VOICE_CEO
  content: "# Voice CEO · Pointer Document\n\n**Loại:** L4.Style · pointer doc · KHÔNG atomize facts.\n\n**Doctrine:**\
    \ Voice CEO là phán xét tự do, đứng NGOÀI đường kiểm registry. Không có ID atomic. Đây là input để sinh, không\
    \ phải thứ đối chiếu cơ học.\n\n---\n\n## Canonical sources\n\n### Primary\n- **`_governance/RtR_Voice_Nuance_v1.md`**\
    \ · canonical document voice CEO\n  - Tác giả: AI Officer Lâm (compile từ CEO communication 2025-2026)\n  -\
    \ Last update: 26/05/2026\n  - Phạm vi: voice cho RtR corporate communication\n\n### Skill packages\n- **`lam-nguyen-voice`**\
    \ · digital twin viết tiếng Việt (journalism, op-ed, social posts)\n  - Plugin path: `/var/folders/.../skills/lam-nguyen-voice/`\n\
    \  - Trigger: \"viết theo giọng tôi\", \"phong cách của tôi\", bài báo/op-ed/Facebook\n  \n- **`rtr-van-phong-nha-nuoc`**\
    \ · văn phong gửi cơ quan nhà nước VN\n  - Plugin path: `/var/folders/.../skills/rtr-van-phong-nha-nuoc/`\n\
    \  - Trigger: công văn, tờ trình, báo cáo, thư đề nghị phối hợp\n\n- **`rtr-event-social`** · social media voice\
    \ cho RtR events\n  - Plugin path: `/var/folders/.../skills/rtr-event-social/`\n  - Trigger: caption LinkedIn/Facebook/IG/X/YouTube\
    \ cho RtR events\n\n---\n\n## Phạm vi áp dụng\n\n| Audience | Skill khuyến nghị |\n|---|---|\n| Bài báo / op-ed\
    \ / Facebook personal | `lam-nguyen-voice` |\n| Công văn gửi Sở/Bộ/UBND | `rtr-van-phong-nha-nuoc` |\n| LinkedIn/Facebook\
    \ RtR corporate | `rtr-event-social` |\n| Deck pitch khách hàng | Voice Nuance + `lam-nguyen-deck-style` |\n\
    | Brochure marketing | `rtr-brochure-system` |\n| Email internal | Voice Nuance (relaxed register) |\n\n---\n\
    \n## Vì sao L4 đứng ngoài registry?\n\n- Voice CEO không kiểm cơ học được như giá ($69.900 verifiable)\n- Brand\
    \ standard không có ID atomic value\n- Để style cạnh bảng giá tạo ảo giác rằng style kiểm được như facts\n-\
    \ Khi atomize voice (vd: \"câu phải dài ≤ 15 từ\") → false precision, không giúp gì\n\n**Đúng cách:** L4 là\
    \ input cho sinh. Skill đọc, hiểu, áp. Không cần ID.\n\n---\n\n## Skill refactor (Lô 3, future)\n\nKhi skill\
    \ `lam-nguyen-deck-style` hoặc `rtr-brochure-system` hard-code spec HERA trong prose, refactor để trỏ tới `SPEC.HERA.*`\
    \ registry IDs. Nhưng voice rules trong skill KHÔNG cần atomize, giữ prose tự do.\n\n---\n\n## Built\n\nPha\
    \ 5 + Lô 4 · 2026-06-16"
